name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contract checks
        run: python3 Tests/check_contract.py

      - name: Tile plan verification
        run: python3 Tests/verify_tile_plan.py

      - name: Syntax check
        run: make check

      - name: Build
        run: make
