name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compiler Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          else
            sudo apt-get install -y gcc
          fi

      - name: Compile Verum Engine (Pure C)
        run: |
          make clean
          make CC=${{ matrix.compiler }}

      - name: Verify Binary Execution
        run: |
          ./verum-slice --help || ./verum-slice || true

      - name: Run Architecture Contract Tests
        run: |
          python3 -c "
          import os, sys
          assert os.path.exists('verum-slice'), 'Binary missing'
          print('>> Binary compiled and linked successfully.')
          "
